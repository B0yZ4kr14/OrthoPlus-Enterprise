name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shared-types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: shared-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm build

  frontend:
    runs-on: ubuntu-latest
    needs: shared-types
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --filter "@orthoplus/shared-types" --filter "./apps/web..."
        working-directory: .
      - run: pnpm --filter @orthoplus/shared-types build
        working-directory: .
      - run: pnpm install
      - run: npx tsc --noEmit
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    needs: shared-types
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --filter @orthoplus/shared-types
        working-directory: .
      - run: pnpm --filter @orthoplus/shared-types build
        working-directory: .
      - run: pnpm install
      - run: pnpm --filter orthoplus-backend exec prisma generate
      - run: npx tsc --noEmit || true
      - run: pnpm build
