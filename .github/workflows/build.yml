name: Build & TypeScript Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Generate Prisma Client
        run: pnpm --filter orthoplus-backend exec prisma generate

      - name: TypeScript type check
        run: pnpm run type-check
      
      - name: Build project
        run: pnpm run build
        env:
          VITE_API_BASE_URL: ""
      
      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sh apps/web/dist/ | cut -f1)
          echo "Bundle size: $BUNDLE_SIZE"
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/web/dist/
          retention-days: 7

  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build shared-types
        run: pnpm --filter @orthoplus/shared-types build

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        working-directory: backend

      - name: Backend TypeScript build
        run: pnpm run build
        working-directory: backend

      - name: Backend tests
        run: pnpm test
        working-directory: backend
