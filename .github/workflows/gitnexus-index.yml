name: GitNexus Index

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitnexus-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GitNexus
        run: npm install -g gitnexus@1.6.5  # Pinned version for reproducibility

      - name: Run GitNexus analysis
        run: npx gitnexus analyze
        env:
          # NOTE: Configure GITNEXUS_API_KEY in repository secrets if API access is needed
          # For local indexing without API, this can be omitted
          GITNEXUS_API_KEY: ${{ secrets.GITNEXUS_API_KEY }}

      - name: Upload index artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gitnexus-index
          path: .gitnexus/
          retention-days: 7
