name: Deploy to VPS vps-orthoplus

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-orthoplus
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2

      - name: Install Dependencies
        run: pnpm install

      - name: Build Shared Types
        run: pnpm --filter @orthoplus/shared-types build

      - name: Generate Prisma Client
        run: pnpm --filter orthoplus-backend exec prisma generate

      - name: Type Check Backend
        run: pnpm --filter orthoplus-backend type-check || true

      - name: Build Backend
        run: pnpm --filter orthoplus-backend build

      - name: Build Frontend
        run: pnpm --filter @orthoplus/web build

      - name: Validate Docker Compose
        run: docker compose config || true

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_TSiAPP_HOST }}
          username: ${{ secrets.VPS_TSiAPP_USER }}
          key: ${{ secrets.VPS_TSiAPP_SSH_KEY }}
          source: "backend/dist/"
          target: "/home/tsi/OrthoPlus-Enterprise-backend/"
          strip_components: 1
          rm: true

      - name: Deploy Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_TSiAPP_HOST }}
          username: ${{ secrets.VPS_TSiAPP_USER }}
          key: ${{ secrets.VPS_TSiAPP_SSH_KEY }}
          source: "apps/web/dist/"
          target: "/tmp/orthoplus-dist/"
          strip_components: 1
          rm: true

      - name: Restart Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_TSiAPP_HOST }}
          username: ${{ secrets.VPS_TSiAPP_USER }}
          key: ${{ secrets.VPS_TSiAPP_SSH_KEY }}
          script: |
            # Deploy backend into running Docker container
            sudo docker cp /home/tsi/OrthoPlus-Enterprise-backend/. orthoplus-backend:/app/dist/
            sudo docker restart orthoplus-backend
            
            # Deploy frontend into running Docker container
            sudo docker cp /tmp/orthoplus-dist/index.html orthoplus-app:/usr/share/nginx/html/index.html
            sudo docker exec orthoplus-app sh -c 'rm -rf /usr/share/nginx/html/assets/*'
            sudo docker cp /tmp/orthoplus-dist/assets/. orthoplus-app:/usr/share/nginx/html/assets/
            sudo docker exec orthoplus-app nginx -s reload
            
            # Cleanup
            rm -rf /tmp/orthoplus-dist
            
            # Health checks
            sleep 5
            echo "=== Backend Health ==="
            curl -sf http://127.0.0.1:3005/health || echo "Backend health check failed"
            echo "=== Frontend Health ==="
            curl -sfI http://127.0.0.1:8083/ | head -1 || echo "Frontend health check failed"
            
            echo "Deploy completed successfully"

      - name: Health Check (External)
        run: |
          sleep 10
          curl -s http://${{ secrets.VPS_TSiAPP_HOST }}:3005/health || echo "⚠️ Health check failed"
