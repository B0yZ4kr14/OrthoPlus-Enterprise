name: Quality Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Type Check
        run: pnpm run type-check
      
      - name: Lint
        run: pnpm run lint
        continue-on-error: true
      
      - name: Format Check
        run: pnpm run format:check
        continue-on-error: true
      
      - name: Build
        run: pnpm run build
        env:
          VITE_API_BASE_URL: ""
      
      - name: Test
        run: pnpm test
      
      - name: Quality Validation
        run: pnpm run validate:quality
      
      - name: Bundle Size Check
        run: |
          SIZE_KB=$(du -s apps/web/dist | cut -f1)
          SIZE_MB=$((SIZE_KB / 1024))
          echo "Bundle size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 10 ]; then
            echo "❌ Bundle size exceeds 10MB"
            exit 1
          fi
          echo "✅ Bundle size is acceptable"
