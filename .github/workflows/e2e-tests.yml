name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 25
    continue-on-error: true
    runs-on: ubuntu-24.04

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: orthoplus
      DB_USER: orthoplus
      DB_PASSWORD: orthoplus
      DATABASE_URL: postgresql://orthoplus:orthoplus@localhost:5432/orthoplus
      JWT_SECRET: "test-jwt-secret-for-e2e-tests-minimum-32-characters-long"
      IA_ENCRYPTION_KEY: "test-encryption-key-for-e2e-tests-32chars-long"
      LGPD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      LGPD_ENCRYPTION_SALT: "0123456789abcdef"
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      CI: true

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orthoplus
          POSTGRES_PASSWORD: orthoplus
          POSTGRES_DB: orthoplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build shared-types
        run: pnpm --filter @orthoplus/shared-types build

      - name: Generate Prisma Client
        run: pnpm --filter orthoplus-backend exec prisma generate

      - name: Create PostgreSQL schemas
        run: |
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -c '
            CREATE SCHEMA IF NOT EXISTS "administrativo";
            CREATE SCHEMA IF NOT EXISTS "backups";
            CREATE SCHEMA IF NOT EXISTS "clinico";
            CREATE SCHEMA IF NOT EXISTS "comercial";
            CREATE SCHEMA IF NOT EXISTS "core";
            CREATE SCHEMA IF NOT EXISTS "crypto_config";
            CREATE SCHEMA IF NOT EXISTS "database_admin";
            CREATE SCHEMA IF NOT EXISTS "github_tools";
            CREATE SCHEMA IF NOT EXISTS "operacional";
            CREATE SCHEMA IF NOT EXISTS "terminal";
          '

      - name: Sync Prisma schema (db push)
        run: pnpm --filter orthoplus-backend exec prisma db push --accept-data-loss

      - name: Seed database
        run: pnpm --filter orthoplus-backend exec tsx prisma/seed.ts
        env:
          SEED_ADMIN_PASSWORD: "admin123!"

      - name: Build frontend
        run: pnpm --filter @orthoplus/web build
        env:
          VITE_API_BASE_URL: ""

      - name: Create Playwright auth state
        run: |
          mkdir -p tests/e2e/.auth
          TOKEN=$(cd backend && node -e "
            const jwt = require('jsonwebtoken');
            const token = jwt.sign(
              {sub:'user-001',email:'admin@orthoplus.com',role:'ADMIN',clinicId:'clinic-001'},
              process.env.JWT_SECRET,
              {expiresIn:'1h'}
            );
            console.log(token);
          ")
          EXPIRES=$(($(date +%s) + 3600))
          cat > tests/e2e/.auth/state.json << EOF
          {
            "cookies": [{
              "name": "access_token",
              "value": "$TOKEN",
              "domain": "localhost",
              "path": "/",
              "expires": $EXPIRES,
              "httpOnly": true,
              "secure": false,
              "sameSite": "Strict"
            }],
            "origins": [{
              "origin": "http://localhost:8080",
              "localStorage": [{"name": "ortho-theme", "value": "premium-light"}]
            }]
          }
          EOF

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E smoke tests
        run: pnpm exec playwright test --project=${{ matrix.browser }} --grep "Smoke Tests"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-videos-${{ matrix.browser }}
          path: test-results/**/*.webm
          retention-days: 7

  report:
    name: Publish Test Report
    needs: test
    runs-on: ubuntu-24.04
    if: always()

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Publish HTML Report
        uses: peaceiris/actions-gh-pages@v4
        if: hashFiles('playwright-report') != ''
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: test-reports/${{ github.run_number }}
