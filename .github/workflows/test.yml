name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libsqlite3-dev
      
      - name: Install dependencies
        run: pnpm install

      - name: Rebuild better-sqlite3 for current platform
        run: pnpm rebuild better-sqlite3

      - name: Build shared-types
        run: pnpm --filter @orthoplus/shared-types build

      - name: Generate Prisma Client
        run: pnpm --filter orthoplus-backend exec prisma generate
      
      - name: Run unit tests
        run: pnpm test
        
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
