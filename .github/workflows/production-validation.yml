name: Production Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate Production Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make validation script executable
        run: chmod +x ./scripts/validate-production.sh

      - name: Generate test secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: Run production validation (dry-run with test env)
        env:
          NODE_ENV: production
          PORT: "3005"
          AUTH_ALLOW_MOCK: "false"
          ENABLE_DANGEROUS_ADMIN_ENDPOINTS: "false"
          DB_SSL: "true"
          DATABASE_URL: "postgresql://<user>:<password>@localhost:5432/orthoplus?sslmode=require"
          REDIS_PASSWORD: "<REMOVED>"
          ALLOWED_ORIGINS: "https://example.com"
        run: ./scripts/validate-production.sh

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        # Critical vulnerabilities block the pipeline; high-severity ones should be triaged regularly
        run: pnpm audit --audit-level=critical

  build-production:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build shared-types
        run: pnpm --filter @orthoplus/shared-types build

      - name: Generate Prisma Client
        run: pnpm --filter orthoplus-backend exec prisma generate

      - name: Build frontend (production)
        run: pnpm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL || 'https://example.com/api' }}

      - name: Build backend (production)
        run: pnpm --filter orthoplus-backend run build
        env:
          NODE_ENV: production
