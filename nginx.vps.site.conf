# ============================================================================
# OrthoPlus Nginx Site Configuration - Production Hardened (Site-specific)
# ============================================================================

# Upstream Backend Services
upstream backend {
    least_conn;
    server 127.0.0.1:3005 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream agent_service {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream minio_s3 {
    server 127.0.0.1:9000;
    keepalive 32;
}

# Rate Limiting Zones (Note: Should ideally be in the main nginx.conf http block, but can be here too)
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# HTTP Server (Redirect to HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name tsiapp.io;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tsiapp.io;

    ssl_certificate /etc/nginx/ssl/orthoplus.crt;
    ssl_certificate_key /etc/nginx/ssl/orthoplus.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # Global rate limiting
    limit_req zone=global_limit burst=20 nodelay;
    limit_conn conn_limit 10;

    # Backend API (/api/*)
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        include /etc/nginx/proxy_params;
    }

    # AI Agent Service (/api/agent/*)
    location /api/agent/ {
        proxy_pass http://agent_service/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        include /etc/nginx/proxy_params;
        
        # Streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # MinIO S3 API
    location /s3/ {
        proxy_pass http://minio_s3/;
        include /etc/nginx/proxy_params;
        client_max_body_size 100M;
    }

    # Frontend SPA
    location / {
        root /var/www/orthoplus;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
