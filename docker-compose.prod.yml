# ============================================================================
# OrthoPlus — Production Docker Compose
# ============================================================================

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: orthoplus-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - orthoplus
    networks:
      - orthoplus-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: orthoplus/backend:latest
    container_name: orthoplus-backend
    restart: always
    expose:
      - "3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
    env_file:
      - .env.production
    depends_on:
      - redis
    networks:
      - orthoplus-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health', (r) => { if (r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  agent-service:
    build:
      context: ./agent-service
      dockerfile: ./Dockerfile
    image: orthoplus/agent-service:latest
    container_name: orthoplus-agent
    restart: always
    expose:
      - "8000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    env_file:
      - .env.production
    depends_on:
      - backend
    networks:
      - orthoplus-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  orthoplus:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    image: orthoplus/frontend:latest
    container_name: orthoplus-app
    restart: always
    expose:
      - "8080"
    networks:
      - orthoplus-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: orthoplus-redis
    restart: always
    command: >
      sh -c 'if [ -z "$$REDIS_PASSWORD" ]; then echo "FATAL: REDIS_PASSWORD not set" >&2; exit 1; fi;
      redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru'
    env_file:
      - .env.production
    volumes:
      - redis-data:/data
    networks:
      - orthoplus-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  redis-data:

networks:
  orthoplus-network:
    driver: bridge
