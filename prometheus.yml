# Prometheus Configuration for Ortho+

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'orthoplus-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules
rule_files:
  - "prometheus-alerts.yml"
  # - "alerts.yml"

scrape_configs:
  # Backend API Metrics
  - job_name: 'orthoplus-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ["backend:3005"]
    scrape_interval: 10s

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Node Exporter (System Metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
