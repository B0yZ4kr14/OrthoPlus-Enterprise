<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Gradientes premium -->
    <linearGradient id="gradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0EA5E9" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Ícone: Dental Shield / Cross Premium -->
  <g transform="translate(20, 20)" filter="url(#shadow)">
    <!-- Hexágono de fundo -->
    <path d="M35 5 L60 18.5 L60 46.5 L35 60 L10 46.5 L10 18.5 Z" fill="url(#gradIcon)" opacity="0.1"/>
    <path d="M35 8 L57 20.5 L57 44.5 L35 57 L13 44.5 L13 20.5 Z" fill="none" stroke="url(#gradIcon)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Cruz médica estilizada dentro do hex -->
    <path d="M35 18 L35 30 L47 30 L47 35 L35 35 L35 47 L30 47 L30 35 L18 35 L18 30 L30 30 L30 18 Z" fill="url(#gradIcon)" filter="url(#glow)"/>
    
    <!-- Arco dental sutil -->
    <path d="M22 42 Q35 52 48 42" fill="none" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Texto: OrthoPlus -->
  <g transform="translate(95, 35)">
    <text x="0" y="32" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="url(#gradText)" letter-spacing="-0.5">
      OrthoPlus
    </text>
    <!-- Enterprise badge -->
    <rect x="168" y="12" width="82" height="22" rx="6" fill="url(#gradIcon)" opacity="0.1"/>
    <rect x="168" y="12" width="82" height="22" rx="6" fill="none" stroke="url(#gradIcon)" stroke-width="1.5" opacity="0.3"/>
    <text x="209" y="27" font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0EA5E9" text-anchor="middle" letter-spacing="1.5">ENTERPRISE</text>
  </g>
  
  <!-- Tagline -->
  <g transform="translate(95, 72)">
    <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="400" fill="#64748B" letter-spacing="0.3">
      Sistema de Gestão Odontológica
    </text>
  </g>
</svg>
