# nginx-prod-template.conf
# Source of Truth: ObsidianVault/01-Playbooks/DevOps/frontend-domain-bind-playbook.md

server {
    listen 80;
    listen [::]:80;
    server_name orthoplus.i9corp.com.br;

    # Auto-redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name orthoplus.i9corp.com.br;

    # [SSL configuration would be injected here via certbot: /etc/letsencrypt/live/orthoplus.i9corp.com.br/...]

    # =========================================================================
    # CSP: Bypass TrustedHTML block and isolate PM2 API Layer
    # =========================================================================
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/orthoplus/dist;
    index index.html;

    # Vite React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy for PM2 Backend
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings for heavy payloads (reports/AI)
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }
}
